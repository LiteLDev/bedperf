    const l = lines[i];
    if (l.startsWith('```')) { const buf = []; i++; while (i < lines.length && !lines[i].startsWith('```')) buf.push(lines[i++]); i++; out.append(h('pre', { text: buf.join('\n') })); continue; }
    const m = /^(#{1,4}) (.*)/.exec(l); if (m) { out.append(h('h' + (m[1].length + 1), {}, inline(m[2]))); i++; continue; }
    if (l.startsWith('|')) { const rows = []; while (i < lines.length && lines[i].startsWith('|')) rows.push(lines[i++]);
      const cells = r => r.replace(/^\||\|$/g, '').split('|').map(x => x.trim());
      const t = h('table'); t.append(h('thead', {}, h('tr', {}, cells(rows[0]).map(c => h('th', {}, inline(c))))));
      const tb = h('tbody'); for (const r of rows.slice(2)) tb.append(h('tr', {}, cells(r).map(c => h('td', {}, inline(c))))); t.append(tb); out.append(h('div', { style: 'overflow:auto' }, t)); continue; }
    if (/^- /.test(l)) { const ul = h('ul'); while (i < lines.length && /^- /.test(lines[i])) ul.append(h('li', {}, inline(lines[i++].slice(2)))); out.append(ul); continue; }
    if (l.trim()) out.append(h('p', {}, inline(l)));
    i++;
  }
  return out;
}
RENDER.notes = async () => {
  const el = $('#t-notes'); el.textContent = '';
  const f = (await load('files.json')).json;
  el.append(md(f['README.md']), h('div', { class: 'card md' }, h('h3', { text: '关于本页' }),
    h('p', { text: '本页是离线单文件，所有数据以 gzip 压缩嵌入，在浏览器中解压，不依赖网络。由 scripts/pack_report.py 从本目录的 CSV、meta、scripts 生成；数据更新后重新运行该脚本即可。' })));
};

// ---------------------------------------------------------------- boot
(async () => {
  const id = (location.hash || '#overview').slice(1);
  $('#t-overview').append(h('div', { class: 'loading', text: '正在解压数据…' }));
  try {
    const [r, c] = await Promise.all([load('runs.csv'), load('capacity_summary.csv'), load('steps.csv'), load('dispatch_jobs.csv'), load('attempts.csv')]);
    RUNS = r.rows; CAP = c.rows; BYKEY = new Map(RUNS.map(x => [x.host + '|' + x.runId, x]));
    showTab(TABS.some(t => t[0] === id) ? id : 'overview');
  } catch (e) {
    $('#t-overview').textContent = '数据解压失败：' + e.message + '。需要支持 DecompressionStream 的浏览器（Chrome/Edge 80+、Firefox 113+、Safari 16.4+）。';
  }
})();
